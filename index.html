<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Quản lý lớp học</title>
<style>
:root{--bg:#eef1f8;--cd:#fff;--tx:#172036;--mu:#6c768c;--pr:#4f6bff;--pr2:#8a4fff;--bd:#e4e8f2;--ok:#16a874;--no:#e5484d;--wa:#e8a100;--sh:0 4px 16px #1b2a5a14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131b;--cd:#1a1f2e;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#2c3347;--pr:#6c8cff;--sh:none}}
:root[data-theme="dark"]{--bg:#10131b;--cd:#1a1f2e;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#2c3347;--pr:#6c8cff;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:auto;padding:12px 12px 96px}
.hd{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.hd select,.hd input{background:#fff;color:#172036;border:0}.gl{background:#ffffff33;color:#fff;border:0;border-radius:10px}.dn{margin-top:10px}.dn input{flex:1;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input,textarea,button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button{cursor:pointer}button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.d{color:var(--no)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;border:0;background:none;font-size:11px;display:flex;flex-direction:column;align-items:center;padding:4px 0;color:var(--mu)}.nav button b{font-size:19px;font-weight:400}.nav button.on{color:var(--pr);font-weight:700}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.tl div{background:var(--cd);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;color:var(--mu);box-shadow:var(--sh)}.tl b{display:block;font-size:22px;color:var(--tx)}.tl .ok b{color:var(--ok)}.tl .no b{color:var(--no)}.tl .wa b{color:var(--wa)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.s{padding:6px 14px;border-radius:20px;font-size:13px;border:0;color:#fff}.P,.Y{background:var(--ok)}.A{background:var(--no)}.L{background:var(--wa)}.N{background:var(--mu)}
.sr{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:var(--sh)}.sr.ab{border-color:var(--no);background:#e5484d12}
.sn{display:flex;align-items:center;gap:8px}.sn b{flex:1}.ix{width:24px;height:24px;border-radius:50%;background:var(--bd);font-size:12px;display:grid;place-items:center}.x{padding:2px 8px}
.ct{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pl{border-radius:20px;padding:6px 12px}
.hw{margin:6px 6px 0 0;border-radius:20px;border:1px solid var(--bd);padding:5px 12px;font-size:13px}.hw.y{background:var(--ok);color:#fff;border-color:var(--ok)}.hw.p{background:var(--wa);color:#fff;border-color:var(--wa)}
.g{display:grid;gap:8px}.seat{min-height:54px;border:1.5px dashed var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;padding:4px;cursor:pointer;background:var(--cd)}
.seat.f{border-style:solid;border-color:var(--pr)}.seat.ab{background:#e5484d22;border-color:var(--no)}.seat.sl{outline:3px solid var(--wa)}
.chip{display:inline-block;margin:3px;padding:5px 12px;border-radius:16px;border:1px solid var(--bd);cursor:pointer;font-size:13px}.chip.Y,.chip.sl{background:var(--ok);color:#fff;border-color:var(--ok)}.chip.P2,.chip.sl{background:var(--wa);color:#fff;border-color:var(--wa)}
.sec{font-weight:600;margin-top:10px;font-size:13px}.bg{text-align:center;background:var(--bd);border-radius:8px;padding:4px;margin-bottom:8px;font-size:13px;color:var(--mu)}
.big{font-size:28px;font-weight:700;text-align:center;padding:14px;color:var(--pr)}.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pb{background:var(--bd);border-radius:6px;height:8px;min-width:70px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ok)}
.bar2{display:flex;align-items:flex-end;gap:10px;height:110px;padding-top:6px}.bar2 div{flex:1;text-align:center;font-size:12px}.bar2 i{display:block;background:var(--no);border-radius:4px 4px 0 0;margin-bottom:3px}
.st{font-size:12px;padding:3px 10px;border-radius:12px;background:#ffffff33}.cd .st{background:var(--bd)}.st.rd{background:#e5484d22;color:var(--no)}
.mo{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20}.md{background:var(--cd);border-radius:16px;padding:16px;width:min(92vw,360px)}
.ts{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#172036;color:#fff;padding:10px 16px;border-radius:20px;z-index:20;font-size:14px;max-width:90vw}
.ro .ed{display:none!important}.ro button.s,.ro .seat,.ro .chip,.ro .tb,.ro .hw{pointer-events:none}
#pr{display:none}.ok2{background:#16a87418;border-color:var(--ok);color:var(--ok);font-weight:600}.warn{border-color:var(--wa);background:#e8a10018}.ro .at{display:none!important}.tm .ed{display:none!important}
@media print{body>.w,#dl{display:none}#pr{display:block;padding:10px;color:#000}#pr table th,#pr table td{border:1px solid #999}#pr .seat{border:1px solid #666;background:#fff;color:#000}#pr .bg{background:#eee;color:#000}}
</style></head><body>
<div class="w" id="app">Đang tải…</div><div id="pr"></div><div id="dl"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.toISOString().slice(0,10),TD=iso(new Date()),addD=(d,n)=>iso(new Date(Date.parse(d)+864e5*n)),fmt=d=>d?d.split('-').reverse().join('/'):'';
let S={classes:[]},cur=null,date=TD,tab='today',sel=null,extra='',open=null,db=null,canW=true,pend=false,ready=false,tm=false,own=true,me=null,P={};
const Q={};
const norm=c=>{['students','seats','att','sub','tasks','talk','done'].forEach(k=>c[k]=c[k]||{});c.rows=c.rows||4;c.cols=c.cols||6;return c};
const C=()=>S.classes.find(c=>c.id===cur);
const lsave=()=>{try{localStorage.setItem('qll2',JSON.stringify(S.classes))}catch(e){}};
function sv(c,patch){if(db){const r=db.doc('classes/'+c.id);Q[c.id]=(Q[c.id]||Promise.resolve()).then(()=>patch?r.update(patch):r.set(JSON.parse(JSON.stringify(c)))).catch(()=>toast('⚠️ Không lưu được: tài khoản này chỉ có quyền xem'))}else lsave();R()}
const ST=c=>Object.entries(c.students).map(([id,s])=>({id,name:s.name})).sort((a,b)=>{const l=x=>x.name.trim().split(/\s+/).pop(),r=l(a).localeCompare(l(b),'vi');return r||a.name.localeCompare(b.name,'vi')});
const nm=(c,id)=>(c.students[id]||{}).name||'';
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const att=(c,id)=>((c.att[date]||{})[id])||'P',tkv=(c,id,d=date)=>((c.talk[d]||{})[id])||{g:0,k:0};
const pct=(a,b)=>b?Math.round(100*a/b):0;
const sv3=(c,a,id)=>{let v=(c.sub[a]||{})[id];return v===true?'y':(v==='y'||v==='p')?v:'n'},dn=(c,a)=>ST(c).filter(s=>sv3(c,a,s.id)==='y').length,HW={y:'Hoàn thành',p:'Làm thiếu',n:'Chưa làm'};
const dd=n=>{date=addD(date,n);R()},toast=m=>{$('#dl').innerHTML='<div class="ts">'+m+'</div>';setTimeout(()=>$('#dl').innerHTML='',2400)};
function dlg(h,ok){if(!h){$('#dl').innerHTML='';return}$('#dl').innerHTML='<div class="mo"><div class="md">'+h+'<div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="dlg()">Hủy</button><button class="p" id="dok">OK</button></div></div></div>';$('#dok').onclick=()=>{let r=ok&&ok();if(r!==false)$('#dl').innerHTML=''}}
const cf=(m,f)=>dlg('<b>'+E(m)+'</b>',()=>{f()});
function repTxt(c){let A=ST(c),ab=A.filter(s=>att(c,s.id)==='A'),lt=A.filter(s=>att(c,s.id)==='L'),nms=a=>a.map(s=>s.name).join(', ')||'không có';
let t=`📋 BÁO CÁO LỚP ${c.name} – ${fmt(date)}\n👥 Sĩ số ${A.length} | Có mặt ${A.length-ab.length} | Vắng ${ab.length}\n❌ Vắng: ${nms(ab)}\n⏰ Muộn: ${nms(lt)}\n`,T=Object.entries(c.tasks).filter(([k,x])=>x.d===date||x.g===date);
T.forEach(([k,x])=>{let g=a=>A.filter(s=>sv3(c,k,s.id)===a);t+=`\n📝 ${x.t} (giao ${fmt(x.g)}, hạn ${fmt(x.d)}): hoàn thành ${g('y').length}/${A.length}\n⬜ Chưa hoàn thành: ${nms(g('n'))}\n⚠️ Làm thiếu: ${nms(g('p'))}\n`});
if(!T.length)t+='\n📝 Không có bài tập giao/hạn nộp hôm nay.\n';
let sp=A.map(s=>({n:s.name,o:tkv(c,s.id)})).filter(x=>x.o.g+x.o.k);return t+`\n🙋 Phát biểu: ${sp.length?sp.map(x=>`${x.n} (tốt ${x.o.g}, khá ${x.o.k})`).join('; '):'chưa có'}`}
async function cp(){let t=$('#rt');try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand('copy')}toast('Đã sao chép! Dán vào Zalo/Messenger gửi giáo viên')}
function sh(){navigator.share({text:$('#rt').value}).catch(()=>{})}
function bk(){let t=$('#bt');t.value=JSON.stringify(C());t.select();try{document.execCommand('copy')}catch(e){}toast('Đã chép mã sao lưu lớp này')}
function rs(){try{let o=JSON.parse($('#bt').value);if(!o.name)throw 0;o.id=uid();let c=norm(o);S.classes.push(c);cur=c.id;sv(c)}catch(e){toast('Mã không hợp lệ')}}
function addClass(){dlg('<b>Thêm lớp</b><input id="dn1" placeholder="Tên lớp (vd: 10A1)" style="width:100%;margin-top:8px"><input id="dy1" value="2026-2027" style="width:100%;margin-top:8px">',()=>{let n=$('#dn1').value.trim();if(!n)return false;let c=norm({id:uid(),name:n,year:$('#dy1').value.trim()});S.classes.push(c);cur=c.id;sv(c)})}
function delClass(){let c=C();c&&cf('Xóa lớp '+c.name+' và toàn bộ dữ liệu?',()=>{S.classes=S.classes.filter(x=>x!==c);if(db)db.doc('classes/'+c.id).delete().catch(()=>{});cur=S.classes[0]?.id||null;lsave();R()})}
function ren(){let c=C();dlg('<b>Đổi tên lớp</b><input id="dn1" value="'+E(c.name)+'" style="width:100%;margin-top:8px">',()=>{let n=$('#dn1').value.trim();if(!n)return false;c.name=n;sv(c,{name:n})})}
function addSt(){let c=C(),t=$('#ns').value.split('\n').map(x=>x.trim()).filter(Boolean),p={};t.forEach(n=>{let id=uid();c.students[id]={name:n};p[id]={name:n}});sv(c,{students:p})}
function delSt(id){let c=C();cf('Xóa '+nm(c,id)+'?',()=>{delete c.students[id];for(let k in c.seats)if(c.seats[k]===id)delete c.seats[k];sv(c)})}
function cyc(id){let c=C(),v={P:'A',A:'L',L:'P'}[att(c,id)];(c.att[date]=c.att[date]||{})[id]=v;sv(c,{att:{[date]:{[id]:v}}})}
function tk(id,t){let c=C(),o={...tkv(c,id)};if(t==='r')o={g:0,k:0};else o[t]++;(c.talk[date]=c.talk[date]||{})[id]=o;sv(c,{talk:{[date]:{[id]:o}}})}
function tg(a,id){let c=C(),v={n:'y',y:'p',p:'n'}[sv3(c,a,id)];(c.sub[a]=c.sub[a]||{})[id]=v;sv(c,{sub:{[a]:{[id]:v}}})}
function allSub(a,v){let c=C(),m=c.sub[a]=c.sub[a]||{},p={};ST(c).forEach(s=>p[s.id]=m[s.id]=v);sv(c,{sub:{[a]:p}})}
function addTask(){let c=C(),t=$('#qt').value.trim();if(!t)return;let id=uid(),o={t,g:$('#qg').value,d:$('#qd').value,n:$('#qn').value.trim()};c.tasks[id]=o;sv(c,{tasks:{[id]:o}})}
function delTask(a){cf('Xóa bài tập này?',()=>{let c=C();delete c.tasks[a];delete c.sub[a];if(open===a)open=null;sv(c)})}
function taskForm(){return '<div class="cd ed"><b>➕ Giao bài tập mới</b><div class="row" style="margin-top:6px"><input id="qt" placeholder="Tên bài tập (vd: BT trang 45)" style="flex:1;min-width:160px"><input id="qn" placeholder="Ghi chú" style="flex:1;min-width:120px"></div><div class="row" style="margin-top:6px">Giao <input type="date" id="qg" value="'+date+'"> Hạn nộp <input type="date" id="qd" value="'+addD(date,1)+'"><button class="p" onclick="addTask()">Giao BT</button></div></div>'}
function setDim(k,v){let c=C();c[k]=Math.max(1,Math.min(12,+v||1));sv(c,{[k]:c[k]})}
function seatClick(k){let c=C(),t=c.seats[k];if(sel){let old=Object.keys(c.seats).find(x=>c.seats[x]===sel);if(old)delete c.seats[old];if(t&&old)c.seats[old]=t;c.seats[k]=sel;sel=null;sv(c)}else if(t){sel=t;R()}}
function unseat(){let c=C();for(let k in c.seats)if(c.seats[k]===sel)delete c.seats[k];sel=null;sv(c)}
function shuffle(){let c=C(),ids=shuf(ST(c).map(s=>s.id)),ks=[];for(let r=0;r<c.rows;r++)for(let q=0;q<c.cols;q++)ks.push(r+'-'+q);c.seats={};ids.slice(0,ks.length).forEach((id,i)=>c.seats[ks[i]]=id);sv(c)}
function clr(){let c=C();c.seats={};sv(c)}
function pick(){let c=C(),p=ST(c).filter(s=>att(c,s.id)!=='A');if(!p.length)return;extra='<div class="big">🎯 '+E(p[Math.random()*p.length|0].name)+'</div>';R()}
function groups(){let c=C(),n=+$('#gn').value||4,a=shuf(ST(c).map(s=>s.id)),g=Array.from({length:n},()=>[]);a.forEach((id,i)=>g[i%n].push(nm(c,id)));extra=g.map((x,i)=>'<div class="cd"><b>Nhóm '+(i+1)+'</b>: '+E(x.join(', '))+'</div>').join('');R()}
const L={P:'Có mặt',A:'Vắng',L:'Muộn'};
const nA=(c,id)=>Object.values(c.att).filter(m=>m[id]==='A').length;
async function who(id){if(!id||P[id]!==undefined)return;P[id]='';try{let u=await claude.use('user'),r=await u.profiles([id]);P[id]=(r[id]&&r[id].name)||''}catch(e){}R(true)}
function doneTxt(c){let o=(c.done||{})[date];if(!o)return'';who(o.by);return'✅ Đã chốt điểm danh lúc '+new Date(o.t).toTimeString().slice(0,5)+(P[o.by]?' · '+E(P[o.by]):o.by&&o.by===me?' · bạn':'')}
function allP(){let c=C(),p={};ST(c).forEach(s=>p[s.id]='P');c.att[date]=Object.assign(c.att[date]||{},p);sv(c,{att:{[date]:p}});toast('Đã đặt cả lớp có mặt')}
function closeDay(){let c=C(),o={t:Date.now(),by:me||''};(c.done=c.done||{})[date]=o;sv(c,{done:{[date]:o}});toast('Đã chốt điểm danh ngày '+fmt(date))}
function seatHTML(c,live){let h='<div class="bg">BẢNG / BỤC GIẢNG</div><div class="g" style="grid-template-columns:repeat('+c.cols+',1fr)">';for(let r=0;r<c.rows;r++)for(let q=0;q<c.cols;q++){let k=r+'-'+q,id=c.seats[k];h+='<div class="seat'+(id?' f':'')+(id&&live&&att(c,id)==='A'?' ab':'')+(id&&id===sel?' sl':'')+'"'+(live?' onclick="seatClick(\''+k+'\')"':'')+'>'+(id?E(nm(c,id)):'')+'</div>'}return h+'</div>'}
const dueT=c=>Object.entries(c.tasks).filter(([k,t])=>t.d===date);
function todayHTML(c,pr){let dt=Object.entries(c.tasks).filter(([k,t])=>t.d===date||t.g===date);
if(pr)return '<table><tr><th>#</th><th>Họ tên</th><th>Điểm danh</th><th>Phát biểu</th>'+dt.map(([k,t])=>'<th>'+E(t.t)+'</th>').join('')+'</tr>'+ST(c).map((s,i)=>{let o=tkv(c,s.id);return '<tr><td>'+(i+1)+'</td><td>'+E(s.name)+'</td><td>'+L[att(c,s.id)]+'</td><td>'+(o.g+o.k?'Tốt '+o.g+' · Khá '+o.k:'')+'</td>'+dt.map(([k])=>'<td>'+HW[sv3(c,k,s.id)]+'</td>').join('')+'</tr>'}).join('')+'</table>';
return ST(c).map((s,i)=>{let a=att(c,s.id),o=tkv(c,s.id);return `<div class="sr ${a==='A'?'ab':''}"><div class="sn"><span class="ix">${i+1}</span><b>${E(s.name)}${nA(c,s.id)>=3?' <span class="st rd">vắng '+nA(c,s.id)+'</span>':''}</b><button class="d ed x" onclick="delSt('${s.id}')">✕</button></div><div class="ct"><button class="s ${a}" onclick="cyc('${s.id}')">${L[a]}</button><button class="tb pl" onclick="tk('${s.id}','g')">👍 ${o.g}</button><button class="tb pl" onclick="tk('${s.id}','k')">👌 ${o.k}</button><button class="ed pl" onclick="tk('${s.id}','r')">↺</button></div><div>${dt.map(([k,t])=>{let v=sv3(c,k,s.id);return `<button class="hw ${v}" onclick="tg('${k}','${s.id}')">${E(t.t.slice(0,16))}: ${HW[v]}</button>`}).join('')}</div></div>`}).join('')||'<div class="cd mu">Chưa có học sinh. Mở “Thêm học sinh” ở trên.</div>'}
function year(c){let ds=Object.keys(c.att).filter(k=>Object.keys(c.att[k]).length).sort(),T=Object.entries(c.tasks).filter(([k,t])=>t.d<=TD);
let rows=ST(c).map(s=>{let a=0,l=0;ds.forEach(d=>{let v=c.att[d][s.id];if(v==='A')a++;if(v==='L')l++});let h=T.filter(([k])=>sv3(c,k,s.id)==='y').length,p=0,n=0;for(let d in c.talk){let o=c.talk[d][s.id];if(o){p+=2*o.g+o.k;n+=o.g+o.k}}return{n:s.name,a,l,h,ht:T.length,p,tn:n}});
let mo={};ds.forEach(d=>{let m=d.slice(0,7);mo[m]=mo[m]||0;mo[m]+=Object.values(c.att[d]).filter(v=>v==='A').length});return{ds,T,rows,mo}}
function yearHTML(c,pr){let y=year(c),N=ST(c).length,mx=Math.max(1,...Object.values(y.mo));
let h='<div class="cd sc"><b>👥 Tổng hợp cả năm</b> <span class="mu">('+y.ds.length+' buổi đã điểm danh · '+y.T.length+' bài tập đã đến hạn)</span><table><tr><th>Học sinh</th><th>Chuyên cần</th><th>Vắng</th><th>Muộn</th><th>Nộp BT</th><th>Phát biểu</th></tr>'+y.rows.map(r=>'<tr><td>'+E(r.n)+'</td><td>'+pct(y.ds.length-r.a,y.ds.length)+'%</td><td>'+r.a+'</td><td>'+r.l+'</td><td>'+(pr?r.h+'/'+r.ht:'<div class="row"><div class="pb"><i style="width:'+pct(r.h,r.ht)+'%"></i></div>'+r.h+'/'+r.ht+'</div>')+'</td><td>'+r.p+' điểm ('+r.tn+' lượt)</td></tr>').join('')+'</table></div>';
if(!pr)h+='<div class="cd"><b>📅 Vắng theo tháng</b><div class="bar2">'+Object.entries(y.mo).map(([m,v])=>'<div><i style="height:'+Math.round(80*v/mx)+'px"></i>'+v+'<br>T'+m.slice(5)+'</div>').join('')+'</div></div>';
